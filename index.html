<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Олимпиада по информатике</title><style>body{font:16px system-ui;background:#f3f5fa;color:#192238;margin:0}.wrap{max-width:820px;margin:35px auto;padding:0 18px}header,.question{background:white;border-radius:16px;padding:24px;margin:16px 0;box-shadow:0 3px 16px #16243b0d}h1{margin-top:0}label{display:block;margin:12px 0}input[type=text],textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #b9c3d5;border-radius:8px;font:inherit}textarea{min-height:100px}button{background:#354ed2;color:white;border:0;padding:14px 22px;border-radius:10px;font:inherit;cursor:pointer}button:disabled{opacity:.5}small{color:#52617c}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.timer{font-weight:700;color:#ad293e}#status{margin:18px 0;font-weight:600}.options label{padding:9px;border:1px solid #e1e6f1;border-radius:8px;cursor:pointer}</style></head><body><main class="wrap"><header><div class="top"><h1>Олимпиада по информатике</h1><div class="timer" id="timer">45:00</div></div><p>10 заданий · 45 минут · 30 баллов. Развёрнутые ответы оцениваются преподавателем.</p><label>Имя <input id="firstName" type="text" maxlength="80" required></label><label>Фамилия <input id="lastName" type="text" maxlength="80" required></label></header><form id="quiz"></form><button id="submit" type="button">Завершить и отправить</button><div id="status" role="status"></div></main><script>
// Вставьте URL опубликованного веб-приложения Apps Script.
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyXvSar30TtAZNlPeYv3waXGeCVtL_PcATVLGfgbS68mxLk1ozAFyO5R3JEH5Jv2zPk-g/exec';
const QUESTIONS = [
{id:'q1',points:2,type:'choice',text:'Какое устройство выполняет арифметические и логические операции?',options:['Монитор','Процессор','Клавиатура','Принтер']},
{id:'q2',points:2,type:'choice',text:'Сколько бит в одном байте?',options:['4','8','16','32']},
{id:'q3',points:2,type:'choice',text:'Что выведет Python: print(2 ** 3 + 1)?',options:['7','9','16','24']},
{id:'q4',points:2,type:'choice',text:'Какое условие истинно при x = 7?',options:['x < 5','x == 6','x > 5 and x < 10','x % 2 == 0']},
{id:'q5',points:2,type:'choice',text:'Сколько раз выполнится цикл for i in range(2, 9, 2)?',options:['3','4','5','7']},
{id:'q6',points:3,type:'short',text:'Запиши десятичное значение двоичного числа 10110.'},
{id:'q7',points:3,type:'short',text:'Чему равно значение переменной s после выполнения: s=0; for i in range(1,5): s+=i ?'},
{id:'q8',points:4,type:'short',text:'Робот стоит в точке (0,0). Он сделал 3 шага вправо, 2 вверх, 5 влево и 1 вниз. Запиши конечные координаты в формате x,y.'},
{id:'q9',points:5,type:'long',text:'Объясни, чем цикл for отличается от цикла while. Приведи пример задачи, для которой удобен каждый из них.'},
{id:'q10',points:5,type:'long',text:'Напиши алгоритм или программу на Python, которая находит наибольшее из трёх введённых чисел. Объясни решение.'}
];
const quiz=document.getElementById('quiz');QUESTIONS.forEach((q,i)=>{const section=document.createElement('section');section.className='question';const title=document.createElement('h3');title.textContent=`${i+1}. ${q.text}`;section.append(title);const small=document.createElement('small');small.textContent=`Максимум ${q.points} балл(ов)`;section.append(small);if(q.type==='choice'){const options=document.createElement('div');options.className='options';q.options.forEach((option,j)=>{const label=document.createElement('label');const radio=document.createElement('input');radio.type='radio';radio.name=q.id;radio.value=String(j);label.append(radio,document.createTextNode(' '+option));options.append(label)});section.append(options)}else{const field=document.createElement(q.type==='long'?'textarea':'input');if(q.type!=='long')field.type='text';field.id=q.id;field.maxLength=q.type==='long'?4000:150;section.append(field)}quiz.append(section)});
let seconds=45*60;let finished=false;const timer=setInterval(()=>{if(finished)return;seconds--;document.getElementById('timer').textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;if(seconds<=0){clearInterval(timer);send()}},1000);
async function send(){if(finished)return;const firstName=document.getElementById('firstName').value.trim(),lastName=document.getElementById('lastName').value.trim();const status=document.getElementById('status');if(!firstName||!lastName){status.textContent='Введите имя и фамилию.';return}if(!SCRIPT_URL.startsWith('https://script.google.com/')){status.textContent='Преподаватель ещё не настроил адрес отправки.';return}const answers={};QUESTIONS.forEach(q=>{answers[q.id]=q.type==='choice'?(document.querySelector(`input[name="${q.id}"]:checked`)?.value??''):document.getElementById(q.id).value.trim()});const payload={firstName,lastName,answers};const button=document.getElementById('submit');button.disabled=true;status.textContent='Отправляем ответы…';try{ // text/plain избегает CORS preflight. Режим no-cors не позволяет прочитать подтверждение сервера.
await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});finished=true;clearInterval(timer);document.querySelectorAll('input,textarea').forEach(el=>el.disabled=true);status.textContent='Запрос отправлен. Подтвердите у преподавателя, что результат появился в таблице.'}catch(err){button.disabled=false;status.textContent='Не удалось отправить ответы. Проверьте интернет и повторите попытку.'}}
document.getElementById('submit').addEventListener('click',send);
</script></body></html>
